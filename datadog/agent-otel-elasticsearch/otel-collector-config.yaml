# OpenTelemetry Collector — DataDog Agent (additional_endpoints) → OTEL Collector → Elasticsearch
#
# Distribution required: opentelemetry-collector-contrib (contains datadogreceiver)
# Install: https://opentelemetry.io/docs/collector/install/
#
# How it works:
#   1. The DataDog Agent keeps its primary dd_url pointing at app.datadoghq.com
#   2. additional_endpoints in datadog.yaml also sends a copy to this collector (:8080)
#   3. The collector receives metrics in the DataDog wire format and forwards ONLY to Elasticsearch
#
# The DataDog flow is completely independent — this collector is purely an ES forwarder.

receivers:
  datadog:
    # datadogreceiver — listens for metrics in the DataDog wire format.
    # The DataDog Agent sends a copy of all metrics here via additional_endpoints in datadog.yaml,
    # while its primary dd_url connection to app.datadoghq.com continues unaffected.
    # Port 8080 is used to avoid conflicts with the DataDog Agent's built-in OTEL Collector
    # which already occupies the default OTLP ports (:4317/:4318).
    endpoint: 0.0.0.0:8080

processors:
  batch:
    # Buffer up to 10 s or 1 000 data points before flushing — reduces request overhead
    timeout: 10s
    send_batch_size: 1000

  memory_limiter:
    # Prevent OOM if a burst of metrics arrives; adjust to ~50% of available RAM
    check_interval: 5s
    limit_mib: 512

exporters:
  # Active exporter: OTLP to Elastic Cloud or Elastic Serverless ingest endpoint
  otlp/elasticsearch:
    endpoint: <ELASTIC_CLOUD_INGEST_ENDPOINT>
    # Find your OTLP endpoint: Elastic Cloud console → Deployment → Copy endpoint
    # Typically: https://<deployment>.ingest.<region>.aws.elastic-cloud.com
    headers:
      Authorization: ApiKey <YOUR_BASE64_API_KEY>

  # Alternative exporter: native Elasticsearch HTTP exporter (document-level control)
  # Swap this into the pipeline below if you prefer direct ES indexing over OTLP.
  # elasticsearch:
  #   endpoint: "https://<YOUR_ES_ENDPOINT>"
  #   headers:
  #     Authorization: "ApiKey <YOUR_BASE64_API_KEY>"
  #   tls:
  #     insecure: false
  #   retry_on_failure:
  #     enabled: true
  #     initial_interval: 5s
  #     max_interval: 30s
  #     max_elapsed_time: 300s

service:
  pipelines:
    metrics:
      receivers: [datadog]
      processors: [memory_limiter, batch]
      exporters: [otlp/elasticsearch]
